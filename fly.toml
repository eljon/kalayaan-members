# Fly.io settings. CLOUD.md explains each step; `fly launch` fills in `app`.
app = "kalayaan-stewardship"
primary_region = "sin"            # Singapore: the closest Fly region to Manila

[build]

[[mounts]]
  source = "kalayaan_data"        # the persistent volume (CLOUD.md step 3)
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleep when nobody is using it, wake on the next visit (a few seconds).
  # Fly bills by the second, so a mostly-idle ward app costs very little.
  # Nothing is lost asleep: state is on the volume. A sign-in or a refresh
  # keeps it awake while it runs, because the page is talking to it.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"                  # Chromium needs the room when reading LCR
